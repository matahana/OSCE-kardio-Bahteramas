name: Cek konsistensi

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Jumlah skor checklist
        run: python3 -I tools/cek_skor.py
      - name: Berkas hasil generator sinkron dengan markdown
        run: python3 -I tools/buat_data.py --cek
      - name: Interaksi konsisten dengan checklist
        run: node tools/cek_interaksi.mjs
